[package]
name = "reducaa-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for reducaa image compression engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
reducaa-core = { path = "../reducaa-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
kamadak-exif = "0.6"
