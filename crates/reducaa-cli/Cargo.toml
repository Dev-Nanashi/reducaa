[package]
name = "reducaa-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for offline image compression"

[dependencies]
reducaa-core = { path = "../reducaa-core" }
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
indicatif = "0.17"
colored = "3"
walkdir = "2"
anyhow = "1"
